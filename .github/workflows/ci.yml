name: CI

on:
    workflow_dispatch:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest
        # The two configurations of `just test-all` (test/cmake/KvasirDevicesTest.cmake).
        strategy:
            fail-fast: false
            matrix:
                compiler:
                    - {cc: gcc, cxx: g++}
                    - {cc: clang, cxx: clang++}

        steps:
            - name: Set up C++ environment
              run: |
                pacman -Syu --noconfirm --disable-download-timeout
                pacman -S --noconfirm --disable-download-timeout git cmake base-devel python ${{ matrix.compiler.cc == 'clang' && 'clang' || '' }}

            - name: Checkout repository
              uses: actions/checkout@v5

            # The test tree fetches the Kvasir SDK (master, with only uc_log -> remote_fmt -> string_constant) itself:
            # test/cmake/KvasirDevicesTest.cmake.
            - name: Configure CMake
              run: cmake -S test -B build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
              env:
                CC: ${{ matrix.compiler.cc }}
                CXX: ${{ matrix.compiler.cxx }}

            - name: Build tests
              run: cmake --build build -j"$(nproc)"

            - name: Run tests
              run: cd build && ctest --output-on-failure

            # clang-tidy (Kvasir_SDK master's tools/tidy.py and .clang-tidy, .github/actions/tidy) over this tree:
            # this repository's findings fail, the libraries' are counted as foreign
            - name: clang-tidy
              if: matrix.compiler.cc == 'clang' && !matrix.compiler.sanitizer
              uses: kvasir-io/Kvasir_SDK/.github/actions/tidy@master
              timeout-minutes: 30
              with:
                trees: build
                mode: ${{ github.event_name == 'pull_request' && 'changed' || 'full' }}

    # the include layering of this repository against Kvasir_SDK tools/layers.toml (any finding fails)
    layers:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-layers.yml@master
